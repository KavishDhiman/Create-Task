<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Response</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #0b0e1a;
            --surface:  #111526;
            --card:     #141829;
            --border:   rgba(255,255,255,0.07);
            --text:     #e8ecf4;
            --muted:    #5a6180;
            --accent:   #4f8ef7;
            --get-bg:      rgba(54,201,167,0.08);
            --get-border:  rgba(54,201,167,0.25);
            --del-bg:      rgba(255,99,99,0.08);
            --del-border:  rgba(255,99,99,0.25);
        }

        html, body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
        }

        /* animated background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(ellipse 70% 50% at 20% 10%, rgba(79,142,247,0.07), transparent),
                    radial-gradient(ellipse 50% 60% at 80% 90%, rgba(159,130,255,0.05), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem 5rem;
        }

        /* ── Top bar ── */
        .top-bar {
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3.5rem;
            animation: fadeDown 0.5s ease both;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem;
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 0.4rem 1rem;
            border-radius: 8px;
            transition: color 0.2s, border-color 0.2s;
            cursor: pointer;
            background: none;
        }
        .back-btn:hover { color: var(--accent); border-color: rgba(79,142,247,0.4); }

        .page-badge {
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
        }

        /* ── Hero heading ── */
        .hero {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 2.5rem;
            animation: fadeDown 0.55s 0.05s ease both;
        }

        .hero-eyebrow {
            font-family: 'DM Mono', monospace;
            font-size: 1.3rem;   /* bigger */
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.6rem;
            opacity: 0.8;
        }

        .hero h1 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 5vw, 3rem);
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #e8ecf4 30%, #4f8ef7 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .hero-meta {
            margin-top: 0.8rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
        }
        .status-pill.ok  { background: var(--get-bg); border: 1px solid var(--get-border); color: #36c9a7; }
        .status-pill.err { background: var(--del-bg); border: 1px solid var(--del-border); color: #ff6363; }
        .status-pill::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .row-count {
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            color: var(--muted);
        }

        /* ── Table wrapper ── */
        .table-wrapper {
            width: 100%;
            max-width: 1100px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                    0 0 0 1px rgba(255,255,255,0.03),
                    0 24px 64px rgba(0,0,0,0.45),
                    0 0 80px rgba(79,142,247,0.04);
            animation: fadeUp 0.6s 0.1s ease both;
        }

        /* gradient line at top */
        .table-wrapper::before {
            content: '';
            display: block;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(79,142,247,0.6), rgba(159,130,255,0.4), transparent);
        }

        /* ── Table ── */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            background: rgba(255,255,255,0.025);
            border-bottom: 1px solid var(--border);
        }

        th {
            padding: 1rem 1.6rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        td {
            padding: 1.2rem 1.6rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.95rem;
            font-weight: 500;

            color: var(--text);
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr {
            transition: background 0.15s;
            animation: rowIn 0.35s ease both;
        }
        tbody tr:hover { background: rgba(79,142,247,0.04); }

        /* staggered row animation */
        tbody tr:nth-child(1)  { animation-delay: 0.15s; }
        tbody tr:nth-child(2)  { animation-delay: 0.20s; }
        tbody tr:nth-child(3)  { animation-delay: 0.25s; }
        tbody tr:nth-child(4)  { animation-delay: 0.30s; }
        tbody tr:nth-child(5)  { animation-delay: 0.35s; }
        tbody tr:nth-child(6)  { animation-delay: 0.40s; }
        tbody tr:nth-child(7)  { animation-delay: 0.45s; }
        tbody tr:nth-child(8)  { animation-delay: 0.50s; }
        tbody tr:nth-child(9)  { animation-delay: 0.55s; }
        tbody tr:nth-child(10) { animation-delay: 0.60s; }

        /* first column accent */
        td:first-child {
            color: var(--accent);
            font-weight: 500;
        }

        /* ── Empty / Error state ── */
        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
        }
        .empty-state .icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }
        .empty-state p {
            font-family: 'DM Mono', monospace;
            font-size: 0.82rem;
            color: var(--muted);
        }

        /* ── Footer note ── */
        .footer-note {
            margin-top: 2rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            color: var(--muted);
            opacity: 0.5;
            letter-spacing: 0.05em;
            animation: fadeUp 0.6s 0.3s ease both;
        }

        /* ── Animations ── */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes rowIn {
            from { opacity: 0; transform: translateX(-8px); }
            to   { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
<div class="page">

    <!-- Top bar -->
    <div class="top-bar">
        <button class="back-btn" onclick="window.close()">← Close</button>
        <span class="page-badge">API Response</span>
    </div>

    <!-- Hero -->
    <div class="hero">
        <div class="hero-eyebrow" id="moduleTitle">API Service</div>
        <h1>Response</h1>
        <div class="hero-meta">
            <span class="status-pill ok" id="statusPill">200 OK</span>
            <span class="row-count" id="rowCount"></span>
        </div>
    </div>

    <!-- Table -->
    <div id="successMessage"
         style="
        display:none;
        width:100%;
        max-width:1100px;
        margin-bottom:1rem;
        padding:1rem 1.4rem;
        border-radius:14px;
        background: rgba(54,201,167,0.08);
        border:1px solid rgba(54,201,167,0.25);
        color:#36c9a7;
        font-family:'DM Mono', monospace;
        font-size:0.9rem;
">
    </div>

    <div class="table-wrapper" id="tableWrapper">
        <div class="empty-state" id="emptyState">
            <div class="icon">◌</div>
            <p>No data to display</p>
        </div>
        <table id="dataTable" style="display:none;">
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <div class="footer-note">Generated · <span id="timestamp"></span></div>
</div>

<script>
    document.getElementById('timestamp').textContent = new Date().toLocaleString();

    function render(raw) {
        let data;
        try { data = JSON.parse(decodeURIComponent(raw)); }
        catch { data = { error: 'Could not parse response data' }; }

        const isError = data && data.error;
        const pill = document.getElementById('statusPill');
        if (isError) { pill.textContent = 'Error'; pill.className = 'status-pill err'; }

        if (data.message) {
    document.getElementById('successMessage').style.display = 'block';
    document.getElementById('successMessage').textContent = data.message;

    delete data.message;
}

if (!Array.isArray(data)) data = [data];
        if (data.length === 0 || Object.keys(data[0]).length === 0) return;

        document.getElementById('emptyState').style.display = 'none';
        const table = document.getElementById('dataTable');
        table.style.display = 'table';

        document.getElementById('rowCount').textContent =
            data.length === 1 ? '1 record' : data.length + ' records';

        const keys = Object.keys(data[0]);
        document.getElementById('thead').innerHTML =
            '<tr>' + keys.map(k => `<th>${k}</th>`).join('') + '</tr>';

        document.getElementById('tbody').innerHTML = data.map(row =>
            '<tr>' + keys.map(k => `<td>${row[k] ?? '—'}</td>`).join('') + '</tr>'
        ).join('');
    }

    const params = new URLSearchParams(window.location.search);
    const raw = params.get('data');
    const module = params.get('module');
    if (module) {
    document.getElementById('moduleTitle').textContent = module;
    }

if (raw) render(raw);
</script>
</body>
</html>
